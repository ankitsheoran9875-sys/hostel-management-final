<!DOCTYPE html>
<html>
<head>
  <title>Hostel Rating</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="stylesheet" href="/rating.css">
</head>

<body>

<div class="container">

  <h1>Hostel Rating</h1>

  <form class="form-box">

    <label>Hostel Name</label>
    <input type="text" placeholder="Enter your hostel name">

    <label>Room Number</label>
    <input type="text" placeholder="Enter room number">

    <label>Cleanliness</label>
    <select>
      <option>⭐ 😰</option>
      <option>⭐⭐ 🤔</option>
      <option>⭐⭐⭐ 😊</option>
      <option>⭐⭐⭐⭐ 😁</option>
      <option>⭐⭐⭐⭐⭐ 🤩</option>
    </select>

    <label>Food Quality</label>
    <select>
      <option>⭐ 😰</option>
      <option>⭐⭐ 🤔</option>
      <option>⭐⭐⭐ 😊</option>
      <option>⭐⭐⭐⭐ 😁</option>
      <option>⭐⭐⭐⭐⭐ 🤩</option>
    </select>

    <label>Transport Facilities</label>
    <select>
      <option>⭐ 😰</option>
      <option>⭐⭐ 🤔</option>
      <option>⭐⭐⭐ 😊</option>
      <option>⭐⭐⭐⭐ 😁</option>
      <option>⭐⭐⭐⭐⭐ 🤩</option>
    </select>

    <label>Overall Feedback</label>
    <textarea placeholder="Write your feedback..."></textarea>

    <button type="submit">Submit Rating</button>

  </form>

  <a href="/index.html" class="back-btn">⬅ Back to Home</a>

</div>

</body>
</html>
